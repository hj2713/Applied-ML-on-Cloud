# Kubernetes Secret to store the API key securely
# In production, never commit real secrets to version control.
# This is base64-encoded. To encode your own: echo -n "your-secret" | base64
apiVersion: v1
kind: Secret
metadata:
  name: inference-secret
type: Opaque
data:
  # base64 of "my-secure-api-key-2026"
  API_KEY: bXktc2VjdXJlLWFwaS1rZXktMjAyNg==
